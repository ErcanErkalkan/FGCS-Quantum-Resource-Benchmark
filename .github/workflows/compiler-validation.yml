name: Compiler Locked Validation

on:
  push:
    branches:
      - compiler-validation-v1.1
    paths:
      - src/compiler_validation_qiskit.py
      - .github/workflows/compiler-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiler-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked compiler environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'qiskit==2.4.2'
          python -m pip freeze | sort > compiler_environment_pip_freeze.txt

      - name: Run compiler validation
        run: |
          python src/compiler_validation_qiskit.py --out-dir compiler_validation_artifact
          cp compiler_environment_pip_freeze.txt compiler_validation_artifact/
          sha256sum compiler_validation_artifact/* | sort > compiler_validation_artifact/SHA256SUMS.txt

      - name: Upload compiler evidence
        uses: actions/upload-artifact@v4
        with:
          name: compiler-validation-qiskit-2.4.2
          path: compiler_validation_artifact/
          if-no-files-found: error
          retention-days: 90
